<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icône Nido : un nid et deux œufs. Source des PNG de public/ (voir
       design/DESIGN.md) ; carré plein, iOS et Android arrondissent eux-mêmes.
       Le motif tient dans le cercle central de 80 % (icône « maskable »). -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E88FF"/>
      <stop offset="1" stop-color="#0060C9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#fond)"/>
  <g transform="translate(256 256) scale(1.15) translate(-256 -262)">
  <!-- Œufs -->
  <ellipse cx="218" cy="244" rx="54" ry="70" fill="#FFFFFF"/>
  <ellipse cx="298" cy="252" rx="50" ry="64" fill="#CFE4FF"/>
  <!-- Nid -->
  <path d="M100 262 C 118 370, 394 370, 412 262 C 330 290, 182 290, 100 262 Z" fill="#FFFFFF"/>
  <path d="M136 300 C 200 318, 312 318, 376 300" fill="none" stroke="#0060C9" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  <path d="M168 330 C 220 344, 292 344, 344 330" fill="none" stroke="#0060C9" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
